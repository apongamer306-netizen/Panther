<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panther</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#131211;--line:#2a2724;--tx:#f2eee8;--mut:#9b948b;--ac:#f0b35a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 4vw;background:#000e;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:600 26px Oswald,Impact,sans-serif;letter-spacing:1px;color:var(--ac)}
#q{flex:1;max-width:420px;margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 14px;border-radius:99px;outline:0}
#q:focus,button:focus-visible{outline:2px solid var(--ac)}
button{background:var(--ac);color:#000;border:0;border-radius:99px;padding:9px 16px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
main{padding:8px 0 60px}h2{font:500 21px Oswald,Impact,sans-serif;margin:26px 4vw 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 4vw 6px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:0 4vw}
.c{flex:0 0 140px;scroll-snap-align:start;cursor:pointer}.grid .c{flex:auto}
.c img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--card);display:block}
.c:hover img{outline:2px solid var(--ac)}.c b{display:block;font-weight:500;margin-top:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c small{color:var(--mut)}.empty{color:var(--mut);margin:20px 4vw}
#m{position:fixed;inset:0;background:#000d;display:none;z-index:9;overflow:auto;padding:4vw}
#m.on{display:block}.box{max-width:880px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bd{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}.box iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.in{padding:18px 22px 24px}.in h1{font:600 30px Oswald,Impact,sans-serif;margin:0 0 4px}.meta{color:var(--mut);margin-bottom:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.wh{color:var(--mut)}.wh a{color:var(--ac)}
@media(prefers-reduced-motion:no-preference){.c img{transition:outline-color .15s}}
</style></head><body>
<header><img src="icon-192.png" width="34" height="34" alt="" style="border-radius:8px"><span class="logo">PANTHER</span><input id="q" type="search" placeholder="Search movies, series, anime" aria-label="Search"><button class="g" id="rnd">Surprise me</button></header>
<main id="main"></main>
<div id="m"><div class="box" id="box"></div></div>
<script>
const KEY='1eb38c0d10eeba4285205becfaad8792',API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/';
const today=new Date().toISOString().slice(0,10);
const rec=l=>({with_original_language:l,sort_by:'primary_release_date.desc','primary_release_date.lte':today,'vote_count.gte':10});
const tv=l=>({with_original_language:l,sort_by:'popularity.desc','first_air_date.lte':today});
const ROWS=[
['Trending today','/trending/all/day',{},''],
['In theaters now','/movie/now_playing',{},'movie'],
['Coming soon','/movie/upcoming',{},'movie'],
['Bollywood','/discover/movie',rec('hi'),'movie'],
['South Indian movies',['ta','te','ml','kn'],rec,'movie'],
['Hollywood popular','/movie/popular',{},'movie'],
['Korean dramas','/discover/tv',tv('ko'),'tv'],
['Chinese dramas','/discover/tv',tv('zh'),'tv'],
['Anime','/discover/tv',{...tv('ja'),with_genres:16},'tv'],
['Donghua','/discover/tv',{...tv('zh'),with_genres:16},'tv'],
['Korean movies','/discover/movie',rec('ko'),'movie'],
['Chinese movies','/discover/movie',rec('zh'),'movie'],
['Top rated','/movie/top_rated',{},'movie']];
const $=s=>document.querySelector(s),main=$('#main');let pool=[];
const get=(p,x={})=>fetch(API+p+'?'+new URLSearchParams({api_key:KEY,language:'en-US',...x})).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wl=()=>{try{return JSON.parse(localStorage.pw||'[]')}catch{return[]}};
const norm=(r,t)=>({id:r.id,type:r.media_type||t||(r.name?'tv':'movie'),title:r.title||r.name,poster:r.poster_path,date:(r.release_date||r.first_air_date||'').slice(0,4),vote:r.vote_average});
const card=i=>`<div class="c" tabindex="0" data-id="${i.id}" data-t="${i.type}">${i.poster?`<img loading="lazy" src="${IMG}w342${i.poster}" alt="${esc(i.title)}">`:'<div class="ph"></div>'}<b>${esc(i.title)}</b><small>${i.date||''}${i.vote?' · ★ '+i.vote.toFixed(1):''}</small></div>`;
function section(t,items,grid){if(!items.length)return;pool.push(...items);main.insertAdjacentHTML('beforeend',`<h2>${t}</h2><div class="${grid?'grid':'row'}">${items.map(card).join('')}</div>`)}
async function load(){main.innerHTML='';pool=[];const w=wl();
if(w.length)section('My list',w);
await Promise.all(ROWS.map(async(r,k)=>{try{let res;
 if(Array.isArray(r[1])){const a=await Promise.all(r[1].map(l=>get('/discover/movie',r[2](l))));res=a.flatMap(x=>x.results||[]).sort((a,b)=>(b.release_date||'').localeCompare(a.release_date||'')).slice(0,20)}
 else res=(await get(r[1],r[2])).results||[];
 r.items=res.filter(x=>x.poster_path&&x.media_type!=='person').map(x=>norm(x,r[3]))}catch(e){r.items=[]}}));
ROWS.forEach(r=>section(r[0],r.items));
if(!pool.length)main.innerHTML='<p class="empty">Could not load titles. Check your internet connection and refresh.</p>'}
async function open(id,t){const m=$('#m'),box=$('#box');m.classList.add('on');box.innerHTML='<div class="in">Loading...</div>';
try{const d=await get(`/${t}/${id}`,{append_to_response:'videos,watch/providers'});
const title=d.title||d.name,tr=(d.videos?.results||[]).find(v=>v.site==='YouTube'&&v.type==='Trailer')||(d.videos?.results||[])[0];
const wp=d['watch/providers']?.results||{},reg=wp.BD||wp.IN||wp.US||Object.values(wp)[0];
const names=[...(reg?.flatrate||[]),...(reg?.free||[]),...(reg?.ads||[])].map(p=>p.provider_name);
const saved=wl().some(x=>x.id==id&&x.type==t);
box.innerHTML=`${d.backdrop_path?`<img class="bd" src="${IMG}w1280${d.backdrop_path}" alt="">`:''}<div class="in"><h1>${esc(title)}</h1>
<div class="meta">${(d.release_date||d.first_air_date||'').slice(0,4)} · ★ ${(d.vote_average||0).toFixed(1)} · ${(d.genres||[]).map(g=>esc(g.name)).join(', ')}${d.runtime?' · '+d.runtime+' min':''}${d.number_of_seasons?' · '+d.number_of_seasons+' seasons':''}</div>
<p>${esc(d.overview)||'No summary yet.'}</p>
<div class="btns">${tr?`<button id="tr">Watch trailer</button>`:''}<button class="g" id="sv">${saved?'Remove from my list':'Add to my list'}</button><button class="g" id="cl">Close</button></div>
<div class="wh">${names.length?'Streaming on: '+[...new Set(names)].map(esc).join(', ')+(reg.link?` · <a href="${reg.link}" target="_blank" rel="noopener">See all options</a>`:''):'No streaming info for your region yet.'}</div></div>`;
$('#cl').onclick=close;$('#sv').onclick=()=>{let w=wl();const k=w.findIndex(x=>x.id==id&&x.type==t);k>=0?w.splice(k,1):w.push(norm(d,t));localStorage.pw=JSON.stringify(w);open(id,t);load()};
if(tr)$('#tr').onclick=()=>{const bd=box.querySelector('.bd');const f=document.createElement('iframe');f.allow='autoplay;fullscreen';f.src=`https://www.youtube-nocookie.com/embed/${tr.key}?autoplay=1`;bd?bd.replaceWith(f):box.prepend(f)};
}catch(e){box.innerHTML='<div class="in">Could not load details. <button id="cl">Close</button></div>';$('#cl').onclick=close}}
const close=()=>{$('#m').classList.remove('on');$('#box').innerHTML=''};
$('#m').onclick=e=>{if(e.target.id==='m')close()};document.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.classList?.contains('c'))e.target.click()};
main.onclick=e=>{const c=e.target.closest('.c');if(c)open(c.dataset.id,c.dataset.t)};
$('#rnd').onclick=()=>{if(pool.length){const p=pool[Math.floor(Math.random()*pool.length)];open(p.id,p.type)}};
let tm;$('#q').oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();tm=setTimeout(async()=>{if(!v)return load();
 const r=(await get('/search/multi',{query:v})).results||[];main.innerHTML='';pool=[];
 const it=r.filter(x=>x.media_type!=='person').map(x=>norm(x));it.length?section('Results for '+esc(v),it,true):main.innerHTML='<p class="empty">Nothing found. Try another spelling.</p>'},400)};
load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
