<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panther</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05070a">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--hd:#05070acc;--bg:#05070a;--card:#0e1319;--card2:#151c25;--line:#1f2a36;--tx:#eaf1f7;--mut:#7f8ea0;--ac:#f0b35a;--ac2:#ff7a3d;--glow:#f0b35a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 420px at 15% -5%,#f0b35a14,transparent 70%),radial-gradient(800px 400px at 95% 0,#2a7fff12,transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:var(--hd);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:12px 4vw}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 0 18px var(--glow)}

button{font:inherit;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;border:0;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}button:active{transform:scale(.97)}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}button.g:hover{border-color:var(--ac);box-shadow:none}
button:focus-visible,.c:focus-visible,.tab:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 4vw 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);color:var(--mut);border:1px solid var(--line);padding:7px 16px;border-radius:99px;font-weight:500;font-size:14px;box-shadow:none;transition:all .2s}

.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;border-color:transparent;box-shadow:0 4px 18px var(--glow);font-weight:600}
main{padding:6px 4vw 70px}
h2{font:500 24px Oswald,Impact,sans-serif;letter-spacing:.5px;margin:22px 0 14px;display:flex;align-items:center;gap:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.c{cursor:pointer;min-width:0;animation:in .45s both}

.pw{position:relative;width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card2);box-shadow:0 4px 14px #0008;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}

.pw img.ld{opacity:1}
.pw::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px #ffffff14;pointer-events:none;transition:box-shadow .3s}
.c:hover .pw,.c:focus-visible .pw{transform:translateY(-5px) scale(1.03);box-shadow:0 14px 34px #000c,0 0 0 1px var(--ac),0 0 26px var(--glow)}
.c:hover .pw img{transform:scale(1.05)}
.rt{position:absolute;top:8px;left:8px;background:#000b;backdrop-filter:blur(6px);color:var(--ac);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;z-index:2}
.c b{display:block;font-weight:500;margin-top:9px;font-size:14px;line-height:1.3;height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c small{display:block;color:var(--mut);font-size:12.5px;height:1.3em}
.sk .pw{background:linear-gradient(100deg,var(--card2) 30%,#1d2733 50%,var(--card2) 70%);background-size:300% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.sk .t{height:12px;margin-top:10px;border-radius:6px;background:var(--card2);width:75%}
.empty{color:var(--mut);padding:40px 0;text-align:center}
#more{height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#m{position:fixed;inset:0;background:#000c;backdrop-filter:blur(8px);z-index:50;overflow:auto;padding:4vw;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#m.on{opacity:1;visibility:visible}
.box{max-width:900px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px #000;transform:translateY(24px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#m.on .box{transform:none}
.bd{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}.box iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.in{padding:22px 26px 28px}.in h1{font:600 32px Oswald,Impact,sans-serif;margin:0 0 4px}.meta{color:var(--mut);margin-bottom:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.wh{color:var(--mut)}.wh a{color:var(--ac)}
@media(max-width:620px){.top{flex-wrap:wrap}#q{order:3;max-width:none;flex:1 1 100%;margin:0}#rnd{margin-left:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:16px 10px}.logo{font-size:22px}h2{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pl{--pbg:#05070a;background:var(--pbg);color:var(--tx)}
.pl.light{--pbg:#f4f6f9;--tx:#111;--card:#fff;--card2:#e8edf3;--line:#ccd5de;--mut:#556}
.stage{position:relative;aspect-ratio:16/9;background:#000}.stage iframe,.stage #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.sh{position:absolute;inset:0;z-index:2;cursor:pointer}
.pl:fullscreen{display:flex;flex-direction:column;overflow:auto}.pl:fullscreen .stage{flex:1;aspect-ratio:auto;min-height:50vh}
.bar{display:flex;gap:10px;align-items:center;padding:10px 16px 0}.bar input{flex:1;accent-color:var(--ac)}.bar span{font-size:13px;color:var(--mut);min-width:90px;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;font-size:13px}.row button{padding:7px 14px}.row button.on{border-color:var(--ac);color:var(--ac)}
.row select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:7px 10px;font:inherit;font-size:13px}
.row input[type=range]{accent-color:var(--ac);width:90px}.row label{display:flex;gap:5px;align-items:center;color:var(--mut)}
.pt{padding:4px 16px;font-weight:600}.pls{display:grid;gap:6px;padding:0 16px 16px;max-height:190px;overflow:auto}
.it{text-align:left;border-radius:10px!important;font-weight:500!important;font-size:13px}.it.on{border-color:var(--ac)}
#hp{position:fixed;inset:0;z-index:80;background:#000b;display:flex;align-items:center;justify-content:center;padding:4vw}
.hb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;max-width:460px;width:100%;max-height:90vh;overflow:auto}.hb h3{margin:0 0 10px;font:500 22px Oswald,sans-serif}
.hb div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}.hb button{margin-top:14px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font:600 13px monospace;white-space:nowrap}
@media(max-width:620px){#kb{display:none}}

html[data-theme=light]{--bg:#f3f5f8;--card:#fff;--card2:#e9edf2;--line:#d6dde5;--tx:#121820;--mut:#5a6878;--hd:#f3f5f8d9;--glow:#f0b35a40}
body{overflow-x:hidden}
.dots{width:36px;height:36px;padding:0;font-size:20px;line-height:1;flex:none}

.mh{display:flex;gap:10px;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.mh small{display:block;color:var(--mut);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;object-fit:cover;flex:none}
.mi{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;color:var(--tx);border-radius:10px;padding:10px 12px;font-weight:500;box-shadow:none}
.mi:hover{background:var(--card2);transform:none;box-shadow:none}.mi span{width:20px;text-align:center;color:var(--ac)}
#sht{position:fixed;inset:0;z-index:90;background:#0009;display:flex;align-items:flex-end;justify-content:center;animation:fd .25s both}
@keyframes fd{from{opacity:0}}@keyframes su{from{transform:translateY(100%)}}
.sb{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:24px 24px 30px;animation:su .35s cubic-bezier(.2,.8,.2,1) both}
.sb{max-height:92vh;overflow:auto}.ur{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.ur small{color:var(--mut)}.ur button{padding:5px 12px}
.sb h3{margin:0 0 8px;font:500 22px Oswald,sans-serif}.sb p{color:var(--mut);margin:0 0 14px}.sb .btns{margin:6px 0 0}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:none}
.opt.on,.opt:hover{border-color:var(--ac);transform:none;box-shadow:none}
.subs{gap:8px;overflow-x:auto;padding:0 4vw 12px;scrollbar-width:none}.subs::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;color:var(--mut);border:1px solid var(--line);padding:4px 14px;font-size:13px;box-shadow:none}.chip.on{color:var(--ac);border-color:var(--ac)}.chip:hover{transform:none;box-shadow:none}
.lg{position:absolute;top:8px;right:8px;background:#000b;color:#cbd5e1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;z-index:2}.lg.pf{color:#111;background:var(--ac)}
.lc{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mut)}.lc.on{color:#111;background:var(--ac);border-color:var(--ac);font-weight:600}
#au{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:5vw;overflow:auto;background:radial-gradient(800px 400px at 20% 0,#f0b35a22,transparent 70%),radial-gradient(700px 400px at 90% 100%,#2a7fff1c,transparent 70%),var(--bg);transition:opacity .6s,visibility .6s}
#au.out{opacity:0;visibility:hidden;pointer-events:none}
.ac{width:100%;max-width:420px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px #0006;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.98)}}
.ah{font:600 28px Oswald,sans-serif;text-align:center;margin:14px 0 4px}.ac .sub{color:var(--mut);text-align:center;margin:0 0 18px}.ac .warn{color:var(--ac2)}.ac .fine{font-size:12px;margin:14px 0 0}
.gb{display:flex;justify-content:center;min-height:44px}
.fld{display:grid;gap:5px;margin:12px 0}.fld label{font-size:13px;color:var(--mut)}
.fld input{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
.fld #lgs{display:flex;flex-wrap:wrap;gap:8px}.tos{display:flex;gap:8px;font-size:13px;color:var(--mut);margin:12px 0}.err{color:#ff6b6b;min-height:1.3em;margin:0 0 8px;font-size:13px}
.vb{color:#4ade80;font-size:13px;font-weight:600}
.ck{width:86px;height:86px;display:block;margin:0 auto}.ck circle{fill:none;stroke:#4ade80;stroke-width:3;stroke-dasharray:152;stroke-dashoffset:152;animation:dr .7s .1s forwards}.ck path{fill:none;stroke:#4ade80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
</style></head><body>
<header>
<div class="top"><div class="brand"><img src="icon-192.png" alt=""><span class="logo">PANTHER</span><button class="g dots" id="dots" aria-label="Menu" aria-haspopup="true">⋮</button></div>
<input id="q" type="search" placeholder="Search movies, series, anime" aria-label="Search"><button class="g" id="rnd">Surprise me</button></div>
<nav class="tabs" id="tabs"></nav><div class="subs" id="subs" style="display:none"></div>
</header>
<main><h2 id="ttl"></h2><div class="grid" id="grid"></div><div id="more"></div></main>
<div id="m"><div class="box" id="box"></div></div><div id="mn"></div><div id="au"></div>
<script>
const KEY='1eb38c0d10eeba4285205becfaad8792',API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/';
const today=new Date().toISOString().slice(0,10);const ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const rec=l=>({with_original_language:l,sort_by:'primary_release_date.desc','primary_release_date.lte':today,'vote_count.gte':10});
const tv=l=>({with_original_language:l,sort_by:'popularity.desc','first_air_date.lte':today});
const $=s=>document.querySelector(s);
const get=(p,x={})=>fetch(API+p+'?'+new URLSearchParams({api_key:KEY,language:'en-US',...x})).then(r=>{if(!r.ok)throw 0;return r.json()});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wl=()=>{try{return JSON.parse(localStorage.pw||'[]')}catch{return[]}};
const norm=(r,t)=>({id:r.id,type:r.media_type||t||(r.name?'tv':'movie'),title:r.title||r.name,poster:r.poster_path,date:(r.release_date||r.first_air_date||'').slice(0,4),vote:r.vote_average,lang:r.original_language});
const L=(path,x,t)=>async p=>{const d=await get(path,{...x,page:p});return{items:(d.results||[]).filter(r=>r.poster_path&&r.media_type!=='person').map(r=>norm(r,t)),total:Math.min(d.total_pages||1,50)}};
const M=(path,langs,x,t,key)=>async p=>{const a=await Promise.all(langs.map(l=>get(path,{...x,with_original_language:l,page:p})));
 return{items:a.flatMap(r=>r.results||[]).filter(r=>r.poster_path).sort(key).map(r=>norm(r,t)),total:Math.min(Math.max(...a.map(r=>r.total_pages||1)),30)}};
const byDate=(a,b)=>(b.release_date||b.first_air_date||'').localeCompare(a.release_date||a.first_air_date||''),byPop=(a,b)=>b.popularity-a.popularity;
const mov=ls=>M('/discover/movie',ls,{sort_by:'primary_release_date.desc','primary_release_date.lte':today,'vote_count.gte':10},'movie',byDate);
const drm=ls=>M('/discover/tv',ls,{sort_by:'popularity.desc','first_air_date.lte':today},'tv',byPop);
const TABS=[
{id:'trending',label:'Trending',f:L('/trending/all/day',{})},
{id:'hollywood',label:'Hollywood',subs:[['Popular',L('/movie/popular',{},'movie')],
 ['In theaters',L('/discover/movie',{sort_by:'popularity.desc','primary_release_date.gte':ago(60),'primary_release_date.lte':today,with_release_type:'2|3'},'movie')],
 ['Coming soon',L('/discover/movie',{sort_by:'popularity.desc','primary_release_date.gte':ago(-1),'primary_release_date.lte':ago(-150),with_release_type:'2|3'},'movie')],
 ['Top rated',L('/movie/top_rated',{},'movie')]]},
{id:'indian',label:'Indian movies',subs:[['All',mov(['hi','ta','te','ml','kn'])],['Hindi',mov(['hi'])],['Tamil',mov(['ta'])],['Telugu',mov(['te'])],['Malayalam',mov(['ml'])],['Kannada',mov(['kn'])]]},
{id:'ckmovie',label:'Chinese & Korean movies',subs:[['Both',mov(['ko','zh'])],['Korean',mov(['ko'])],['Chinese',mov(['zh'])]]},
{id:'ckdrama',label:'Chinese & Korean dramas',subs:[['Both',drm(['ko','zh'])],['Korean',drm(['ko'])],['Chinese',drm(['zh'])]]},
{id:'anime',label:'Anime',f:L('/discover/tv',{...tv('ja'),with_genres:16},'tv')},
{id:'donghua',label:'Donghua',f:L('/discover/tv',{...tv('zh'),with_genres:16},'tv')},
{id:'short',label:'Short dramas',f:L('/discover/tv',{sort_by:'popularity.desc','with_runtime.lte':20,with_genres:18,'first_air_date.lte':today,'vote_count.gte':3},'tv')},
{id:'mylist',label:'My list',f:async()=>({items:wl(),total:1})}];
const grid=$('#grid'),more=$('#more'),tabsEl=$('#tabs'),ttl=$('#ttl');
let cur=TABS[0],S=null,pool=[],tok=0;
tabsEl.innerHTML=TABS.map(t=>`<button class="tab" data-id="${t.id}">${t.label}</button>`).join('');
const sk=n=>Array.from({length:n},()=>'<div class="c sk"><div class="pw"></div><div class="t"></div></div>').join('');
const card=(i,k)=>`<div class="c" tabindex="0" data-id="${i.id}" data-t="${i.type}" style="animation-delay:${Math.min(k,12)*35}ms"><div class="pw">${i.vote?`<span class="rt">★ ${i.vote.toFixed(1)}</span>`:''}${i.lang?`<span class="lg${U&&U.langs&&U.langs.includes(i.lang)?' pf':''}">${LN[i.lang]||esc(i.lang.toUpperCase())}</span>`:''}<img loading="lazy" src="${IMG}w342${i.poster}" alt="${esc(i.title)}" onload="this.classList.add('ld')"></div><b title="${esc(i.title)}">${esc(i.title)}</b><small>${i.date||'&nbsp;'}</small></div>`;
function start(fetcher,title){const my=++tok;S={fetcher,page:0,total:1,busy:false,seen:new Set(),my};pool=[];ttl.textContent=title;grid.innerHTML=sk(18);more.innerHTML='';window.scrollTo({top:0});next()}
async function next(){const s=S;if(!s||s.busy||s.page>=s.total)return;s.busy=true;
 if(s.page>0)more.innerHTML='<div class="spin"></div>';
 try{const r=await s.fetcher(s.page+1);if(s!==S)return;
  if(s.page===0)grid.innerHTML='';
  s.page++;s.total=r.total;
  const fresh=r.items.filter(i=>{const k=i.type+i.id;if(s.seen.has(k))return false;s.seen.add(k);return true});
  pool.push(...fresh);grid.insertAdjacentHTML('beforeend',fresh.map((i,k)=>card(i,k)).join(''));
  if(!pool.length)grid.innerHTML='<p class="empty" style="grid-column:1/-1">'+(cur.id==='mylist'&&!S.q?'Your list is empty. Open any title and tap “Add to my list”.':'Nothing found.')+'</p>';
 }catch(e){if(s!==S)return;if(s.page===0)grid.innerHTML='<p class="empty" style="grid-column:1/-1">Could not load titles. Check your internet connection and try again.</p>';s.total=0}
 s.busy=false;more.innerHTML='';check()}
function check(){if(S&&!S.busy&&S.page<S.total&&more.getBoundingClientRect().top<innerHeight+700)next()}
addEventListener('scroll',check,{passive:true});addEventListener('resize',check);
const nav=[];let sub=0;
function pick(id,k,keep){cur=TABS.find(t=>t.id===id);sub=k||0;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 const b=tabsEl.querySelector('.on');b&&b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
 const sb=$('#subs');sb.innerHTML=cur.subs?cur.subs.map((s,i)=>`<button class="chip${i===sub?' on':''}" data-k="${i}">${s[0]}</button>`).join(''):'';sb.style.display=cur.subs?'flex':'none';
 if(!keep&&nav[nav.length-1]!==id)nav.push(id);
 $('#q').value='';start(cur.subs?cur.subs[sub][1]:cur.f,cur.label+(cur.subs&&sub?' · '+cur.subs[sub][0]:''))}

function authStart(){au.classList.remove('out');
 step(`<div class="brand" style="justify-content:center"><img src="icon-192.png" alt=""><span class="logo">PANTHER</span></div><div class="ah">Welcome back</div><p class="sub">Log in to continue watching.</p>
<div class="fld"><label>Email</label><input id="le" type="email" autocomplete="email"></div>
<div class="fld"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><p class="err" id="er"></p>
<button id="li" style="width:100%">Log in</button>${GCLIENT?'<p class="sub" style="margin:14px 0 8px">or</p><div id="gbtn" class="gb"></div>':''}
<p class="sub fine">New here? <a href="#" id="su" style="color:var(--ac)">Create account</a></p>`);
 const er=m=>{$('#er').textContent=m};
 $('#su').onclick=e=>{e.preventDefault();signup()};
 const go=async()=>{const em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;if(!em||!pw)return er('Enter your email and password.');
  const a=accs().find(x=>x.email===em);if(!a||await hp(pw,a.salt)!==a.hash)return er('Wrong email or password.');
  er('Sending code...');$('#li').disabled=true;
  try{verifyScreen(em,await sendCode(em),()=>finish(a),authStart)}catch{er('Could not send the code. Check your connection.');$('#li').disabled=false}};
 $('#li').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
 if(GCLIENT)gsi()}
function signup(){
 step(`<div class="ah">Create account</div><p class="sub">Join Panther in a minute.</p>
<div class="fld"><label>Full name</label><input id="fn" autocomplete="name"></div>
<div class="fld"><label>Username</label><input id="un" placeholder="e.g. panther_fan" autocomplete="username"></div>
<div class="fld"><label>Email</label><input id="em" type="email" autocomplete="email"></div>
<div class="fld"><label>Password (min 8 characters)</label><input id="pw" type="password" autocomplete="new-password"></div>
<div class="fld"><label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password"></div>
<div class="fld"><label>Languages you watch in</label><div id="lgs">${LANGS.map(([c,n])=>`<button type="button" class="chip${c==='en'?' on':''}" data-c="${c}">${n}</button>`).join('')}</div></div>
<label class="tos"><input type="checkbox" id="tos"> I agree to the Terms and Privacy Policy</label><p class="err" id="er"></p><button id="go" style="width:100%">Send verification code</button>
<p class="sub fine">Already have an account? <a href="#" id="bl" style="color:var(--ac)">Log in</a></p>`);
 $('#lgs').onclick=e=>{const b=e.target.closest('.chip');if(b)b.classList.toggle('on')};
 $('#bl').onclick=e=>{e.preventDefault();authStart()};
 const er=m=>{$('#er').textContent=m},v=id=>$('#'+id).value.trim();
 $('#go').onclick=async()=>{const em=v('em').toLowerCase(),un=v('un'),pw=$('#pw').value;
  if(v('fn').length<2)return er('Please enter your full name.');
  if(!/^[a-z0-9_]{3,20}$/i.test(un))return er('Username: 3–20 letters, numbers or _.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return er('Please enter a valid email.');
  if(pw.length<8)return er('Password must be at least 8 characters.');
  if(pw!==$('#pw2').value)return er('Passwords do not match.');
  if(!$('#tos').checked)return er('Please accept the Terms to continue.');
  const all=accs();if(all.some(x=>x.email===em))return er('An account with this email already exists. Log in instead.');
  if(all.some(x=>x.username.toLowerCase()===un.toLowerCase()))return er('That username is taken.');
  $('#go').disabled=true;er('Sending code...');
  const salt=rnd(),a={name:v('fn'),username:un,email:em,salt,hash:await hp(pw,salt),langs:[...document.querySelectorAll('#lgs .chip.on')].map(b=>b.dataset.c),created:Date.now()};
  try{verifyScreen(em,await sendCode(em),()=>{const l=accs();l.push(a);saveAccs(l);finish(a)},signup)}catch{er('Could not send the code. Check your connection.');$('#go').disabled=false}}}
function gsi(){const go=()=>{google.accounts.id.initialize({client_id:GCLIENT,callback:r=>{let p;try{p=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))))}catch{return}
 if(!p.email_verified)return;const a=accs().find(x=>x.email===p.email.toLowerCase());if(a)return finish({...a,picture:p.picture});
 U={name:p.name,email:p.email.toLowerCase(),picture:p.picture,verified:1};lss('pu',U);googleForm()}});google.accounts.id.renderButton($('#gbtn'),{theme:'filled_black',size:'large',shape:'pill',width:280})};
 if(window.google&&google.accounts)return go();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=1;s.onload=go;s.onerror=()=>{$('#gbtn').textContent='Could not load Google sign-in. Check your connection.'};document.head.appendChild(s)}
function googleForm(){const u=U;step(`<div class="ah">Finish your account</div><p class="sub"><span class="vb">✓ Email verified by Google</span><br>${esc(u.email)}</p>
<div class="fld"><label>Full name</label><input id="fn" value="${esc(u.name||'')}"></div>
<div class="fld"><label>Username</label><input id="un" placeholder="e.g. panther_fan"></div>
<div class="fld"><label>Languages you watch in</label><div id="lgs">${LANGS.map(([c,n])=>`<button type="button" class="chip${c==='en'?' on':''}" data-c="${c}">${n}</button>`).join('')}</div></div>
<label class="tos"><input type="checkbox" id="tos"> I agree to the Terms and Privacy Policy</label><p class="err" id="er"></p><button id="go" style="width:100%">Create account</button>`);
 $('#lgs').onclick=e=>{const b=e.target.closest('.chip');if(b)b.classList.toggle('on')};
 $('#go').onclick=()=>{const v=id=>$('#'+id).value.trim(),er=m=>{$('#er').textContent=m};
  if(v('fn').length<2)return er('Please enter your full name.');if(!/^[a-z0-9_]{3,20}$/i.test(v('un')))return er('Username: 3–20 letters, numbers or _.');
  if(accs().some(x=>x.username.toLowerCase()===v('un').toLowerCase()))return er('That username is taken.');if(!$('#tos').checked)return er('Please accept the Terms to continue.');
  const a={name:v('fn'),username:v('un'),email:u.email,salt:'',hash:'',google:1,picture:u.picture,langs:[...document.querySelectorAll('#lgs .chip.on')].map(b=>b.dataset.c),created:Date.now()};
  const l=accs();l.push(a);saveAccs(l);finish(a)}}
function authDone(){step(`<svg class="ck" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg><div class="ah">You’re all in, ${esc((U.name||'').split(' ')[0])}!</div><p class="sub">Account ready. Opening Panther...</p>`);menuUser();setTimeout(()=>au.classList.add('out'),1500)}
/* profile */
function profSave(p){U={...U,...p};lss('pu',U);const l=accs(),a=l.find(x=>x.email===U.email);if(a){Object.assign(a,p);saveAccs(l)}menuUser()}
/* admin */
const adm=()=>lsg('pa',null);
async function admAsk(){const set=!adm();
 sheet(`<h3>${set?'Create admin password':'Admin panel'}</h3><p>${set?'Choose a password (min 6 characters). It is stored on this device only.':'Enter the admin password.'}</p><div class="fld"><input id="ap" type="password" placeholder="Password" autocomplete="off"></div>${set?'<div class="fld"><input id="ap2" type="password" placeholder="Repeat password" autocomplete="off"></div>':''}<p class="err" id="er"></p><div class="btns"><button class="g" id="sx">Cancel</button><button id="ok">${set?'Save':'Open'}</button></div>`);X();
 $('#ok').onclick=async()=>{const pw=$('#ap').value,er=m=>{$('#er').textContent=m};
  if(set){if(pw.length<6)return er('At least 6 characters.');if(pw!==$('#ap2').value)return er('Passwords do not match.');const s=rnd();lss('pa',{s,h:await hp(pw,s)});admPanel()}
  else{const a=adm();if(await hp(pw,a.s)!==a.h)return er('Wrong password.');admPanel()}}}
function admPanel(){const l=accs();
 sheet(`<h3>Admin panel</h3><p>${l.length} user${l.length===1?'':'s'} · ${l.filter(x=>!x.google).length} email · ${l.filter(x=>x.google).length} Google · ${wl().length} saved titles. Data shown is stored on this device only.</p><div id="ul">${l.map(x=>`<div class="ur"><span><b>${esc(x.name)}</b> @${esc(x.username)}<br><small>${esc(x.email)}${x.phone?' · '+esc(x.phone):''}</small></span><button class="g" data-e="${esc(x.email)}">Delete</button></div>`).join('')||'<p>No users yet.</p>'}</div><div class="btns"><button class="g" id="cp">Change password</button><button id="sx">Close</button></div>`);X();
 $('#cp').onclick=()=>{try{localStorage.removeItem('pa')}catch{}admAsk()};
 $('#ul').onclick=e=>{const b=e.target.closest('[data-e]');if(!b||!confirm('Delete this user?'))return;saveAccs(accs().filter(x=>x.email!==b.dataset.e));admPanel()}}
menuUser();
if(U&&U.done){au.style.transition='none';au.classList.add('out');au.offsetHeight;au.style.transition=''}else if(U&&U.verified)googleForm();else authStart();
pick('trending');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
