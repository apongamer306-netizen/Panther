<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panther</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05070a">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--hd:#05070acc;--bg:#05070a;--card:#0e1319;--card2:#151c25;--line:#1f2a36;--tx:#eaf1f7;--mut:#7f8ea0;--ac:#f0b35a;--ac2:#ff7a3d;--glow:#f0b35a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 420px at 15% -5%,#f0b35a14,transparent 70%),radial-gradient(800px 400px at 95% 0,#2a7fff12,transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:var(--hd);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.top{display:flex;gap:12px;align-items:center;padding:5px 3vw}.navrow{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.scr{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px 0}.scr::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:24px;height:24px;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 0 18px var(--glow)}
.logo{font:500 18px Oswald,Impact,sans-serif;letter-spacing:1.5px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:none;width:180px;font-size:12.5px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:3px 12px;height:28px;border-radius:99px;outline:0;transition:border-color .2s,box-shadow .2s}
#q:focus{width:230px;border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
button{font:inherit;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;border:0;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow)}button:active{transform:scale(.97)}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}button.g:hover{border-color:var(--ac);box-shadow:none}
button:focus-visible,.c:focus-visible,.tab:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.tabs{display:flex;gap:5px;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);color:var(--mut);border:1px solid var(--line);padding:3px 11px;border-radius:99px;font-weight:400;font-size:12.5px;line-height:1.5;box-shadow:none;transition:all .2s;white-space:nowrap}.tab svg{display:block}.tab.hm{padding:5px 10px}
.tab:hover{color:var(--tx);border-color:#33465a;transform:none;box-shadow:none}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;border-color:transparent;box-shadow:0 4px 18px var(--glow);font-weight:600}
main{padding:6px 4vw 70px}
h2{font:500 24px Oswald,Impact,sans-serif;letter-spacing:.5px;margin:22px 0 14px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:22px;border-radius:2px;background:linear-gradient(var(--ac),var(--ac2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
.c{cursor:pointer;min-width:0;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pw{position:relative;width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card2);box-shadow:0 4px 14px #0008;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .5s}
.pw img.ld{opacity:1}
.pw::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px #ffffff14;pointer-events:none;transition:box-shadow .3s}
.c:hover .pw,.c:focus-visible .pw{transform:translateY(-5px) scale(1.03);box-shadow:0 14px 34px #000c,0 0 0 1px var(--ac),0 0 26px var(--glow)}
.c:hover .pw img{transform:scale(1.05)}
.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;background:linear-gradient(transparent 55%,#0009);transition:background .2s}
.c:hover .play-overlay{background:rgba(0,0,0,.35)}
.play-btn-circle{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;display:flex;align-items:center;justify-content:center;font-size:17px;padding-left:3px;box-shadow:0 4px 15px rgba(0,0,0,.5);transition:transform .2s}
.c:hover .play-btn-circle{transform:scale(1.15)}
.rt{top:auto!important;bottom:8px!important;z-index:4!important}
.ab{position:absolute;left:8px;top:8px;z-index:4;display:flex;gap:4px;pointer-events:none}
.ab i{font-style:normal;background:var(--ac);color:#111;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px}.ab i.fl{background:#4ade80}
.rt{position:absolute;top:8px;left:8px;background:#000b;backdrop-filter:blur(6px);color:var(--ac);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;z-index:2}
.c b{display:block;font-weight:500;margin-top:9px;font-size:14px;line-height:1.3;height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c small{display:block;color:var(--mut);font-size:12.5px;height:1.3em}
.sk .pw{background:linear-gradient(100deg,var(--card2) 30%,#1d2733 50%,var(--card2) 70%);background-size:300% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.sk .t{height:12px;margin-top:10px;border-radius:6px;background:var(--card2);width:75%}
.empty{color:var(--mut);padding:40px 0;text-align:center}
#more{height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#m{position:fixed;inset:0;background:#000c;backdrop-filter:blur(12px);z-index:50;overflow:auto;padding:1.5vw;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#m.on{opacity:1;visibility:visible}
.box{--tx:#eaf1f7;--mut:#7f8ea0;--line:#1f2a36;--card2:#151c25;color:var(--tx);max-width:1280px;margin:auto;background:#0b0f17;border:1px solid #1f2a36;border-radius:12px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.8);transform:translateY(24px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#m.on .box{transform:none}
.bd{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}

.in{padding:20px 24px 24px}.in h1{font:600 28px Oswald,Impact,sans-serif;margin:0 0 4px}.meta{color:var(--mut);margin-bottom:10px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.wh{color:var(--mut);font-size:13px}
@media(max-width:620px){.top{flex-wrap:wrap;gap:2px}.brand{order:-1;margin-left:auto}.navrow{flex:1 1 100%}.grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:16px 10px}.logo{font-size:22px}h2{font-size:20px}}
html[data-theme=light]{--bg:#f3f5f8;--card:#fff;--card2:#e9edf2;--line:#d6dde5;--tx:#121820;--mut:#5a6878;--hd:#f3f5f8d9}
body{overflow-x:hidden}
.dots{width:30px;height:30px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;flex:none}
.dots span{display:block;width:14px;height:1.5px;background:var(--ac);border-radius:3px;transition:transform .2s}
.dots:hover span{background:var(--ac2)}
#mn{position:fixed;top:68px;left:4vw;z-index:30;min-width:250px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 20px 60px #0007;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top left;transition:all .2s}
#mn.on{opacity:1;visibility:visible;transform:none}
.mh{display:flex;gap:10px;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.mh small{display:block;color:var(--mut);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;object-fit:cover;flex:none}
.mi{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;color:var(--tx);border-radius:10px;padding:10px 12px;font-weight:500;box-shadow:none}
.mi:hover{background:var(--card2);transform:none;box-shadow:none}.mi span{width:20px;text-align:center;color:var(--ac)}
#sht{position:fixed;inset:0;z-index:90;background:#0009;display:flex;align-items:flex-end;justify-content:center;animation:fd .25s both}
@keyframes fd{from{opacity:0}}@keyframes su{from{transform:translateY(100%)}}
.sb{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:24px 24px 30px;animation:su .35s cubic-bezier(.2,.8,.2,1) both}
.sb h3{margin:0 0 8px;font:500 22px Oswald,sans-serif}.sb p{color:var(--mut);margin:0 0 14px}.sb .btns{margin:6px 0 0}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:none}
.opt.on,.opt:hover{border-color:var(--ac);transform:none;box-shadow:none}
.subs{gap:8px;overflow-x:auto;padding:0 3vw 10px;scrollbar-width:none}.subs::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;color:var(--mut);border:1px solid var(--line);padding:4px 14px;font-size:13px;box-shadow:none}.chip.on{color:var(--ac);border-color:var(--ac)}.chip:hover{transform:none;box-shadow:none}
.lg{position:absolute;top:8px;right:8px;background:#000b;color:#cbd5e1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;z-index:2}.lg.pf{color:#111;background:var(--ac)}
.lc{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mut)}.lc.on{color:#111;background:var(--ac);border-color:var(--ac);font-weight:600}
#au{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:5vw;overflow:auto;background:radial-gradient(800px 400px at 20% 0,#f0b35a22,transparent 70%),radial-gradient(700px 400px at 90% 100%,#2a7fff1c,transparent 70%),var(--bg);transition:opacity .6s,visibility .6s}
#au.out{opacity:0;visibility:hidden;pointer-events:none}
.ac{width:100%;max-width:420px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px #0006;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.98)}}
.ah{font:600 28px Oswald,sans-serif;text-align:center;margin:14px 0 4px}.ac .sub{color:var(--mut);text-align:center;margin:0 0 18px}.ac .warn{color:var(--ac2)}.ac .fine{font-size:12px;margin:14px 0 0}
.gb{display:flex;justify-content:center;min-height:44px}
.fld{display:grid;gap:5px;margin:12px 0}.fld label{font-size:13px;color:var(--mut)}
.fld input{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
.fld #lgs{display:flex;flex-wrap:wrap;gap:8px}.tos{display:flex;gap:8px;font-size:13px;color:var(--mut);margin:12px 0}.err{color:#ff6b6b;min-height:1.3em;margin:0 0 8px;font-size:13px}
.vb{color:#4ade80;font-size:13px;font-weight:600}
.ck{width:86px;height:86px;display:block;margin:0 auto}.ck circle{fill:none;stroke:#4ade80;stroke-width:3;stroke-dasharray:152;stroke-dashoffset:152;animation:dr .7s .1s forwards}.ck path{fill:none;stroke:#4ade80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.lc{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mut)}.lc.on{color:#111;background:var(--ac);border-color:var(--ac);font-weight:600}
.wh a{color:var(--ac)}.sb{max-height:92vh;overflow:auto}
#au:empty{display:none}
/* ===== Desktop-style player (PotPlayer / VLC look) ===== */
.pl{display:grid;grid-template-columns:minmax(0,1fr) 340px;background:#05070a;position:relative}
.pl.nopanel{grid-template-columns:minmax(0,1fr)}.pl.nopanel .pside{display:none}.pl.nopanel:fullscreen .pside{display:flex}
.pmain{min-width:0}
.stage{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none}
.stage #yt,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sh{position:absolute;inset:0;z-index:2;cursor:pointer}
.bigp{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 35% 30%,#ffc27acc,#ff7a3dcc 60%,#b34a1acc);box-shadow:0 8px 30px #000a,inset 0 2px 0 #fff5;opacity:0;transform:scale(.8);transition:.2s;pointer-events:none}
.bigp svg{width:38px;height:38px;margin-left:4px}.bigp.on{opacity:1;transform:none}
.topb{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:linear-gradient(#000c,transparent);font-weight:600;font-size:14px;color:#eaf1f7;transition:opacity .3s}
.topb span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:34px 14px 10px;background:linear-gradient(transparent,#000d 55%);transition:opacity .3s;color:#eaf1f7}
.seek{position:relative;height:8px;margin:0 2px 10px;border-radius:6px;background:linear-gradient(#020305,#0b1017);box-shadow:inset 0 1px 3px #000,0 1px 0 #ffffff1a;cursor:pointer;touch-action:none}
.seek::before{content:"";position:absolute;inset:-9px 0}
.buf,.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:0}
.buf{background:#ffffff30}.fill{background:linear-gradient(#ffc27a,#ff7a3d);box-shadow:0 0 8px #ff7a3d99,inset 0 1px 0 #fff6}
.knob{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd9a8 45%,#f0b35a);box-shadow:0 2px 6px #000c,0 0 0 1px #0006;transition:transform .15s}
.seek:hover .knob{transform:scale(1.2)}
.tip{position:absolute;bottom:18px;left:0;transform:translateX(-50%);background:#000d;border:1px solid #2a3647;padding:2px 8px;border-radius:6px;font-size:12px;display:none;pointer-events:none}.seek:hover .tip{display:block}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cl,.cr{display:flex;align-items:center;gap:8px}
.pb{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#e6edf5;background:linear-gradient(#3b4658,#1b222d 55%,#141a23);border:1px solid #05080c;box-shadow:inset 0 1px 0 #ffffff38,0 2px 5px #000a;transition:filter .15s,transform .1s}
.pb:hover{filter:brightness(1.25);transform:none;box-shadow:inset 0 1px 0 #ffffff48,0 2px 5px #000a}
.pb:active{transform:translateY(1px);box-shadow:inset 0 2px 4px #000a}
.pb:disabled{opacity:.4;pointer-events:none}
.pb.big{width:44px;height:44px;border-radius:50%;color:#1a1004;background:linear-gradient(#ffd08a,#f0a040 55%,#d97a22);box-shadow:inset 0 1px 0 #fff8,0 3px 8px #000b}
.pb.sm{width:30px;height:30px}.pb.on{color:var(--ac)}
.vol{position:relative;width:90px;height:8px;border-radius:6px;background:linear-gradient(#020305,#0b1017);box-shadow:inset 0 1px 3px #000,0 1px 0 #ffffff1a;cursor:pointer;touch-action:none}
.vol::before{content:"";position:absolute;inset:-9px 0}
.vf{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(#ffc27a,#ff7a3d);width:100%}
.vk{position:absolute;top:50%;left:100%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd9a8 45%,#f0b35a);box-shadow:0 2px 5px #000c}
.tm{font:13px ui-monospace,Consolas,monospace;color:#cbd5e1;margin-left:6px;white-space:nowrap}
.menu{position:absolute;right:14px;bottom:84px;width:290px;max-height:calc(100% - 130px);overflow:auto;padding:12px 14px;border-radius:14px;background:linear-gradient(#1d2531f2,#0d1219f2);border:1px solid #2a3647;box-shadow:0 14px 40px #000c,inset 0 1px 0 #ffffff1f;display:none}.menu.on{display:block}
.mg{margin-bottom:10px}.mg b{display:block;font-size:11.5px;color:#8fa0b5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-weight:600}
.mc{padding:4px 11px;margin:0 4px 4px 0;font-size:12px;border-radius:8px;color:#dbe4ee;background:linear-gradient(#364254,#1a212b);border:1px solid #05080c;box-shadow:inset 0 1px 0 #ffffff2e}.mc:hover{transform:none;filter:brightness(1.2);box-shadow:inset 0 1px 0 #ffffff2e}.mc.on{color:#1a1004;background:linear-gradient(#ffd08a,#e9902f)}
.mnote{font-size:11px;color:#6f7f92;margin:4px 0 0}
.pside{position:relative;display:flex;flex-direction:column;background:linear-gradient(#111823,#0a0e15);border-left:1px solid #1f2a36;min-height:0;color:#eaf1f7}
.ptabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid #1f2a36}
.ptabs button{flex:1;border-radius:10px 10px 0 0;padding:9px;background:linear-gradient(#232c3a,#161d28);color:#9fb0c4;border:1px solid #05080c;border-bottom:0;font-size:13px;box-shadow:inset 0 1px 0 #ffffff22}.ptabs button:hover{transform:none;box-shadow:inset 0 1px 0 #ffffff22}.ptabs button.on{background:linear-gradient(#ffd08a,#f0a040);color:#1a1004}
.pbody{position:absolute;inset:46px 0 0 0;overflow:auto;padding:8px}
.ep{display:flex;gap:10px;width:100%;text-align:left;padding:6px;margin-bottom:6px;border-radius:10px;background:#131b26;color:#e6edf5;border:1px solid #1f2a36;box-shadow:none;align-items:center;font-weight:400}.ep:hover{transform:none;box-shadow:none;border-color:var(--ac)}.ep.on{border-color:var(--ac);background:#1c2635}
.ep img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000;flex:none}.ep span{min-width:0}.ep b{display:block;font-size:13px;font-weight:500;line-height:1.3;max-height:2.6em;overflow:hidden}.ep small{color:#7f8ea0;font-size:11.5px}
.pbody .in{padding:8px 8px 20px}.pbody .in h1{font-size:22px}
.emp{color:#7f8ea0;padding:16px;text-align:center}
.nov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;color:#8fa0b5;font-size:42px}.nov p{font-size:15px;margin:0;max-width:420px}
.pl.idle{cursor:none}.pl.idle .ctl,.pl.idle .topb{opacity:0;pointer-events:none}
.pl:fullscreen{display:block;background:#000}.pl:fullscreen .pmain,.pl:fullscreen .stage{height:100%;width:100%;aspect-ratio:auto}
.pl:fullscreen .pside{position:absolute;right:0;top:0;bottom:0;width:340px;height:auto;z-index:8;transform:translateX(100%);transition:transform .3s;background:#0a0e15f2}.pl:fullscreen .pside.open{transform:none}.pl.idle:fullscreen .pside.open{transform:translateX(100%)}
@media(max-width:900px){.pl{grid-template-columns:minmax(0,1fr)}.pside{height:340px}.vol{display:none}.tm{font-size:12px}}

.menu{bottom:96px;width:330px;max-height:calc(100% - 150px);padding:8px;z-index:9}
.mr,.mo,.mb{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;border-radius:10px;font-size:15px;font-weight:500;background:none;color:#e6edf5;border:0;box-shadow:none;text-align:left}
.mr:hover,.mo:hover,.mb:hover{background:#ffffff16;transform:none;box-shadow:none}
.mr span{flex:1}.mr em{font-style:normal;color:#9fb0c4;font-size:14px}.mr::after{content:"›";color:#9fb0c4;font-size:22px;line-height:1}
.mo i{width:18px;font-style:normal;color:var(--ac);visibility:hidden}.mo.on i{visibility:visible}.mo.on{color:var(--ac)}

   $('#sht').onclick=e=>{const b=e.target.closest('.mi');if(b){closeSheet();ACT[b.dataset.a]()}else if(e.target.id==='sht')closeSheet()}},
  qual:()=>{const c=lsg('pq','default');sheet('<h3>Playback quality</h3><p>Default video quality. YouTube may still lower it on a slow connection.</p>'+[['default','Auto (recommended)'],['hd1080','1080p'],['hd720','720p'],['large','480p'],['medium','360p']].map(([k,n])=>`<button class="opt${c===k?' on':''}" data-v="${k}">${n}</button>`).join(''));
   $('#sht').onclick=e=>{const b=e.target.closest('.opt');if(b){lss('pq',b.dataset.v);P.q=b.dataset.v;closeSheet()}else if(e.target.id==='sht')closeSheet()}},
  auto:()=>{const c=lsg('pauto',1);sheet('<h3>Autoplay next episode</h3>'+[[1,'On'],[0,'Off']].map(([k,n])=>`<button class="opt${c===k?' on':''}" data-v="${k}">${n}</button>`).join(''));
   $('#sht').onclick=e=>{const b=e.target.closest('.opt');if(b){lss('pauto',+b.dataset.v);P.auto=+b.dataset.v;closeSheet()}else if(e.target.id==='sht')closeSheet()}},
  lang:()=>{const c=lsg('pl','en-US');sheet('<h3>Language</h3><p>Titles and summaries are shown in this language when a translation exists. Menus stay in English for now.</p>'+[['en-US','English'],['bn-BD','বাংলা (Bangla)'],['hi-IN','हिन्दी (Hindi)']].map(([k,n])=>`<button class="opt${c===k?' on':''}" data-v="${k}">${n}</button>`).join(''));
   $('#sht').onclick=e=>{const b=e.target.closest('.opt');if(b){lss('pl',b.dataset.v);closeSheet();location.reload()}else if(e.target.id==='sht')closeSheet()}},
  upd:()=>{sheet('<h3>Updates</h3><p>Panther version 1.0</p><div class="btns"><button id="ck">Check for updates</button><button class="g" id="sx">Close</button></div>');$('#sx').onclick=closeSheet;
   $('#ck').onclick=async()=>{$('#ck').textContent='Checking...';try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch{}location.reload()}},
  priv:()=>{sheet('<h3>Privacy</h3><p>Your list, theme and settings are saved on this device. Videos play through the YouTube player, which has its own privacy policy, and movie details come from TMDB.</p><button class="g" id="sx">Close</button>');$('#sx').onclick=closeSheet}
  };
  $('#dots').onclick=e=>{e.stopPropagation();const r=$('#dots').getBoundingClientRect(),mn=$('#mn');mn.style.top=(r.bottom+8)+'px';mn.style.left=Math.max(8,r.left)+'px';mn.classList.toggle('on')};
  document.addEventListener('click',e=>{if(!e.target.closest('#mn'))$('#mn').classList.remove('on')});
  $('#mn').onclick=e=>{const b=e.target.closest('.mi');if(b){$('#mn').classList.remove('on');ACT[b.dataset.k]()}};
  function showDl(){S=null;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));$('#subs').style.display='none';$('#q').value='';setBn('dl');ttl.textContent='Downloads';more.innerHTML='';pool=[];
   grid.innerHTML='<div class="empty" style="grid-column:1/-1"><p>Offline downloads are not available yet. Panther plays videos through YouTube, which does not allow saving them.</p><p>Add titles to My list to find them quickly.</p><button id="dlml">Open My list</button></div>';$('#dlml').onclick=()=>pick('mylist');scrollTo(0,0)}
  $('#bn').innerHTML=[['hm','home','Home'],['dl','download','Downloads'],['st','gear','Settings']].map(([k,i,n])=>`<button data-k="${k}"${k==='hm'?' class="on"':''}>${ICN[i]}<span>${n}</span></button>`).join('');
  $('#bn').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;$('#mn').classList.remove('on');if(k==='hm'){pick('home');scrollTo({top:0,behavior:'smooth'})}else if(k==='dl')showDl();else ACT.set()};
  menuUser();
  pick('home');
} catch(err) {
  console.error("App Initialization Error:", err);
  document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;font-family:sans-serif;"><h2>Something went wrong.</h2><p>Please check your internet connection or try clearing browser cache (Ctrl + F5).</p></div>';
}
